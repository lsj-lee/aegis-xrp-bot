name: Weekly Model Scanner (주간 무기고 최신화)

# 언제 이 로봇을 가동할 것인가?
on:
  schedule:
    # 매주 월요일 오전 9시 (한국시간) 가동 (UTC 기준 0 0 * * 1)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 사령관님이 깃허브 웹에서 수동으로 '실행' 버튼을 누를 수 있게 해주는 기능

jobs:
  run-scout:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 본부 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: 📦 필요 부품(패키지) 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔐 보안 열쇠 조립 및 정찰병 가동
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GCP_CREDS_JSON: ${{ secrets.GCP_CREDS_JSON }}
      run: |
        # 1. 깃허브 금고(Secrets)에서 꺼낸 구글 키 내용으로 임시 파일을 만듭니다.
        echo "$GCP_CREDS_JSON" > google_key.json
        
        # 2. 임시 파일의 위치를 환경 변수에 입력합니다.
        export GCP_CREDS_PATH="google_key.json"
        
        # 3. 정찰병 가동! (10초 대기 로직 포함)
        python3 aegis_model_scanner.py
        
        # 4. 작전 완료 후 보안을 위해 열쇠 파일 즉각 파기!
        rm google_key.json