name: AEGIS Daily Operations

on:
  schedule:
    # 💡 한국 시간(KST) 오전 7시는 UTC 기준 전날 오후 10시입니다.
    - cron: '0 22 * * *' 
  workflow_dispatch:

jobs:
  run-aegis:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 1. 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 🐍 2. 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 3. 필수 부품 설치 (경량화)
      run: |
        python -m pip install --upgrade pip
        # 💡 클라우드는 연산을 안 하므로 scikit-learn을 뺐습니다.
        pip install gspread google-auth yfinance pandas numpy python-dotenv google-genai requests

    - name: 🔐 4. 비밀 금고 열쇠 복원
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: echo "$GCP_CREDENTIALS" > "gcp_creds.json"

    - name: 🧠 5. [본부] M5가 남긴 데이터로 AI 전략 보고서 작성
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GCP_CREDS_PATH: "gcp_creds.json"
      run: python aegis_strategy_ai.py

    - name: 📤 6. 결과 깃허브 저장
      run: |
        git config --global user.name "AEGIS-Cloud-Bot"
        git config --global user.email "aegis-bot@github.com"
        git add .
        git diff --quiet && git diff --staged --quiet || git commit -m "🤖 AEGIS 아침 7시 정기 리포트 완료"
        git push