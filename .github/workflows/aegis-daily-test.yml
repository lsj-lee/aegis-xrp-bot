name: Daily Full Strategy Test (일일 전략 분석)

# 언제 이 로봇을 가동할 것인가?
on:
  schedule:
    # 매일 새벽 4시 (한국시간) 가동 (UTC 기준 전날 19:00)
    - cron: '0 19 * * *'
  workflow_dispatch: # 사령관님이 수동으로 누를 수 있는 버튼

jobs:
  run-full-test:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 본부 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: 📦 필요 부품(패키지) 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔐 보안 열쇠 조립 및 메인 엔진 가동
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GCP_CREDS_JSON: ${{ secrets.GCP_CREDS_JSON }}
      run: |
        # 1. 깃허브 금고에서 구글 시트 열쇠 생성
        echo "$GCP_CREDS_JSON" > google_key.json
        export GCP_CREDS_PATH="google_key.json"
        
        # 2. 매일 새벽 4시, 풀 테스트 작전 개시!
        python3 aegis_full_test.py
        
        # 3. 작전 완료 후 열쇠 즉각 파기
        rm google_key.json